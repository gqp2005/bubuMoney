name: Vercel Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      run_market_flyer_smoke:
        description: "Run the authenticated market flyer cron after deploy"
        required: true
        default: true
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check Vercel Secrets
        run: |
          if [ -z "${VERCEL_TOKEN}" ]; then
            echo "Missing VERCEL_TOKEN" >&2
            exit 1
          fi
          if [ -z "${VERCEL_ORG_ID}" ]; then
            echo "Missing VERCEL_ORG_ID" >&2
            exit 1
          fi
          if [ -z "${VERCEL_PROJECT_ID}" ]; then
            echo "Missing VERCEL_PROJECT_ID" >&2
            exit 1
          fi
          echo "Secrets present"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Install Vercel CLI
        run: npm i -g vercel
      - name: Link Vercel Project
        run: vercel pull --yes --environment=production --token ${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Pull Vercel Env
        run: vercel env pull .env.local --environment=production --token ${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Build
        run: vercel build --prod --token ${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        run: vercel deploy --prebuilt --prod --token ${{ secrets.VERCEL_TOKEN }}
      - name: Smoke Test Market Flyer Cron
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_market_flyer_smoke }}
        shell: bash
        env:
          MARKET_FLYER_CRON_URL: https://bubumoney.vercel.app/api/cron/market-flyers
        run: |
          node --env-file=.env.local --input-type=module <<'NODE'
          const secret = process.env.CRON_SECRET?.trim();
          if (!secret) {
            throw new Error("CRON_SECRET is missing from the pulled production environment");
          }

          const response = await fetch(process.env.MARKET_FLYER_CRON_URL, {
            headers: { authorization: `Bearer ${secret}` },
          });
          const payload = await response.json().catch(() => null);
          console.log(JSON.stringify({
            status: response.status,
            region: payload?.region ?? null,
            crawled: payload?.crawled ?? null,
            inserted: payload?.inserted ?? null,
            skipped: payload?.skipped ?? null,
            transport: payload?.transport ?? null,
            attempts: payload?.attempts ?? null,
            elapsedMs: payload?.elapsedMs ?? null,
            error: payload?.error ?? null,
          }));

          if (!response.ok) {
            throw new Error(`Market flyer cron smoke test failed with HTTP ${response.status}`);
          }
          NODE
